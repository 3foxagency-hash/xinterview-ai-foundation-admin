  /candidates/invite/third-party/:
    post:
      operationId: candidates_invite_third_party_create
      description:
        Create and invite a candidate via Zapier integration. Requires
        an API key in the `X-API-KEY` header.
      summary: Zapier Candidate Invite
      tags:
        - Zapier Actions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  type: string
                  format: uuid
                  example: 1a5cbea1-f3cf-4f0f-bd4c-5a1a1d0d0edf
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                first_name:
                  type: string
                  example: john
                last_name:
                  type: string
                  example: doe
              required:
                - job
                - email
                - first_name
                - last_name
            examples:
              InviteCandidateRequest:
                value:
                  job: 1a5cbea1-f3cf-4f0f-bd4c-5a1a1d0d0edf
                  email: john.doe@example.com
                  first_name: john
                  last_name: doe
                summary: Invite Candidate Request
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZapierCandidateInput"
              examples:
                InviteCandidateResponse:
                  value:
                    job: 1a5cbea1-f3cf-4f0f-bd4c-5a1a1d0d0edf
                    email: john.doe@example.com
                    first_name: john
                    last_name: doe
                    job_deadline: "2025-05-25T05:59:59Z"
                  summary: Invite Candidate Response
          description: ""
        "400":
          description: Job ID is required. Please provide a valid job identifier.
        "403":
          description: |-
            Permission denied due to one of the following reasons:
            - API key does not belong to the company.
            - Company does not have permission to add candidates.
            - Company has reached its candidate creation limit.
        "404":
          description: Job not found.
        "500":
          description: Server error while sending invite email.
