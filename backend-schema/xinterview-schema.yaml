          description: ""
    patch:
      operationId: update_candidate
      description: Update the details of a specific candidate.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: job_id
          schema:
            type: string
          description: ID of the Job to filter candidates.
          required: true
      tags:
        - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedCandidateRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedCandidateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedCandidateRequest"
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
          description: ""
    delete:
      operationId: delete_candidate
      description: Delete a specific candidate.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: job_id
          schema:
            type: string
          description: ID of the Job to filter candidates.
          required: true
      tags:
        - candidates
      security:
        - jwtAuth: []
      responses:
        "204":
          description: No response body
