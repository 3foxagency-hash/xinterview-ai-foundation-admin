  /candidates/interview/{token}/:
    get:
      operationId: start_interview
      description: |-
        Landing link for the candidates fetches details if candidates exists. else lets candidate register

        The response return 200 if token is verified.
        Response will return {"guest" :  True, "job_id" : <job_id>} if candidate is not registered. i.e invited by direct link
        in such case register candidate by simply posting candidate data to this url.
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
      tags:
        - candidates
      security:
        - jwtAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateInterview"
          description: ""
    post:
      operationId: send_otp_to_candidate
      description: Register candidate and send otp by email
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
      tags:
        - candidates
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CandidateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateRequest"
        required: true
      security:
        - jwtAuth: []
        - {}
      responses:
        "200":
          content:
