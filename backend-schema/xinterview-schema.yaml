  /candidates/pool/{company_id}/:
    get:
      operationId: candidate_pool
      description: Returns all candidates in company with filter applied
      parameters:
        - in: path
          name: company_id
          schema:
            type: string
          required: true
        - in: query
          name: completed_at_after
          schema:
            type: string
            format: date
        - in: query
          name: completed_at_before
          schema:
            type: string
            format: date
        - in: query
          name: job_title
          schema:
            type: string
          description: Search across first name, last name, and email (case insensitive)
        - in: query
          name: joined_at_after
          schema:
            type: string
            format: date
        - in: query
          name: joined_at_before
          schema:
            type: string
            format: date
        - in: query
          name: name
          schema:
            type: string
          description: Search across first name, last name, and email (case insensitive)
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: ratings_max
          schema:
            type: string
            format: decimal
            pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
            nullable: true
          description: Filter by rating range (min and max)
        - in: query
          name: ratings_min
          schema:
            type: string
            format: decimal
            pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
            nullable: true
          description: Filter by rating range (min and max)
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - completed
              - pending
              - started
          description: |-
            Filter by status

            * `pending` - Pending
            * `started` - Started
            * `completed` - Completed
        - in: query
          name: via
          schema:
            type: string
            enum:
              - bulk-invite
              - direct-link
              - invite
              - third-party
          description: |-
            Filter by joining method

            * `invite` - Invite
            * `direct-link` - Direct Link
            * `bulk-invite` - Bulk Invite
            * `third-party` - Third Party
        - in: query
          name: workflow_stage
          schema:
            type: string
          description: Filter by workflow stage name (case insensitive)
      tags:
        - candidates
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCandidatePoolList"
          description: ""
