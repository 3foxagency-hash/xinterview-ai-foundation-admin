  /webhooks/:
    get:
      operationId: validate_api_key
      description:
        Validates the provided API key and returns the associated company
        information if valid.
      tags:
        - API Key Validation
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyValidResponse"
              examples:
                ValidAPIKey:
                  value:
                    valid: true
                    message: API key is valid.
                    company_name: Company XYZ
                  summary: Successful validation
          description: API key is valid.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyInvalidResponse"
              examples:
                InvalidAPIKey:
                  value:
                    valid: false
                    message: API key is missing or invalid.
                  summary: Failed validation
          description: API key is missing or invalid.
  /webhooks/75daad1f-c8a2-443d-b578-f5e5923f6a7d/:
    post:
      operationId: webhooks_75daad1f_c8a2_443d_b578_f5e5923f6a7d_create
      description: |-
        Thin Stripe webhook entrypoint: verify the signature, then delegate to
        ``payments.integration.webhooks.handle_event`` (idempotency + dispatch + idempotent handlers).

        Stripe signs requests, so no authentication is applied; the request is authenticated by the
        signature against ``settings.STRIPE_WEBHOOK_KEY``.
      tags:
        - webhooks
      responses:
        "200":
          description: No response body
components:
  schemas:
    APIKeyInvalidResponse:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
      required:
        - message
        - valid
    APIKeyValidResponse:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
        company_name:
          type: string
      required:
        - company_name
        - message
        - valid
    AccessKey:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        prefix:
          type: string
          readOnly: true
        hashed_key:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description:
            A free-form name for the API key. Need not be unique. 50 characters
            max.
          maxLength: 50
        revoked:
          type: boolean
          readOnly: true
          description:
            If the API key is revoked, clients cannot use it anymore. (This
            cannot be undone.)
        expiry_date:
          type: string
          format: date-time
          nullable: true
          title: Expires
          description: Once API key expires, clients cannot use it anymore.
        company:
          type: integer
          readOnly: true
      required:
        - company
        - created
        - created_at
        - hashed_key
        - id
        - prefix
        - revoked
    AccountTeamSizeEnum:
      enum:
        - 1-10
        - 10-50
        - 50-500
        - 500+
      type: string
      description: |-
        * `1-10` - 1-10
        * `10-50` - 10-50
        * `50-500` - 50-500
        * `500+` - 500+
    AccountTypeEnum:
      enum:
        - CO
        - AG
      type: string
      description: |-
        * `CO` - Corporate
        * `AG` - Agency
    ActiveWithWorkFlow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier of the job.
        title:
          type: string
          description: The title of the job.
          maxLength: 300
        workflow:
          readOnly: true
          description: The workflow of the job.
        type_of_interview:
          type: string
          readOnly: true
          description: The type of interview for the job.
      required:
        - id
        - title
        - type_of_interview
        - workflow
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        address_line1:
          type: string
          description: The first line of the address.
          maxLength: 100
        address_line2:
          type: string
          nullable: true
          description: The second line of the address.
          maxLength: 100
        city:
          type: string
          description: The city of the address.
          maxLength: 100
        state:
          type: string
          description: The state of the address.
          maxLength: 50
        country:
          type: string
          description: The country of the address.
          maxLength: 50
        country_code:
          type: string
          description: The country code of the address.
          maxLength: 50
        zip_code:
          type: string
          description: The zip code of the address.
          maxLength: 20
      required:
        - address_line1
        - city
        - country
        - country_code
        - id
        - state
        - zip_code
    AddressRequest:
      type: object
      properties:
        address_line1:
          type: string
          minLength: 1
          description: The first line of the address.
          maxLength: 100
        address_line2:
          type: string
          nullable: true
          description: The second line of the address.
          maxLength: 100
        city:
          type: string
          minLength: 1
          description: The city of the address.
          maxLength: 100
        state:
          type: string
          minLength: 1
          description: The state of the address.
          maxLength: 50
        country:
          type: string
          minLength: 1
          description: The country of the address.
          maxLength: 50
        country_code:
          type: string
          minLength: 1
          description: The country code of the address.
          maxLength: 50
        zip_code:
          type: string
          minLength: 1
          description: The zip code of the address.
          maxLength: 20
      required:
        - address_line1
        - city
        - country
        - country_code
        - state
        - zip_code
    AgentConfig:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mode:
          $ref: "#/components/schemas/ModeEnum"
        stt_provider:
          type: string
          maxLength: 50
        llm_provider:
          type: string
          maxLength: 50
        tts_provider:
          type: string
          maxLength: 50
        active:
          type: boolean
        company:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - company
        - created_at
        - id
        - updated_at
    AgentConfigRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/ModeEnum"
        stt_provider:
          type: string
          maxLength: 50
        stt_key:
          type: string
          writeOnly: true
        llm_provider:
          type: string
          minLength: 1
          maxLength: 50
        llm_key:
          type: string
          writeOnly: true
          minLength: 1
        tts_provider:
          type: string
          maxLength: 50
        tts_key:
          type: string
          writeOnly: true
        avatar_key:
          type: string
          writeOnly: true
        active:
          type: boolean
        company:
          type: integer
      required:
        - company
        - llm_key
    AgentInterviewConfig:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent_name:
          type: string
          description: The name of the AI agent conducting the interview.
          maxLength: 100
        avatar_id:
          type: string
          nullable: true
          description: The unique identifier of the agent's avatar.
          maxLength: 100
        voice_type:
          allOf:
            - $ref: "#/components/schemas/VoiceTypeEnum"
          description: |-
            The gender voice type for the agent (male or female).

            * `male` - MALE
            * `female` - FEMALE
        voice_id:
          type: string
          description: The unique identifier of the voice to be used.
          maxLength: 100
        tone:
          type: string
          description: The tone of voice for the agent interview.
          maxLength: 100
        language:
          type: string
          description: The language used in the agent interview.
          maxLength: 100
        introduction_script:
          type: string
          nullable: true
          description: The introduction script to be read by the AI agent.
        interview_duration:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The duration of the interview in minutes.
        disclaimer_to_be_included:
          type: boolean
          description:
            Whether to include a disclaimer about the use of AI in the
            interview process.
        job:
          type: string
          format: uuid
          description: The job associated with the agent interview configuration.
          nullable: true
      required:
        - agent_name
        - id
        - interview_duration
        - language
        - tone
