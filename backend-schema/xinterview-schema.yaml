openapi: 3.0.3
info:
  title: XInterview
  version: 1.0.0
  description:
    This is a one way interview platform api that easily integrates                     with
    the various application tracking systems
paths:
  /agent-interview/avatar-audio-log/{candidate_id}/:
    get:
      operationId: agent_interview_avatar_audio_log_retrieve
      description: Fetch logs related to the agent interview session.
      summary: Retrieve interview logs
      parameters:
        - in: path
          name: candidate_id
          schema:
            type: string
            format: uuid
          required: true
        - in: path
          name: token
          schema:
            type: string
          description: JWT token containing candidate_id
          required: true
      tags:
        - Interview
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event:
                      type: string
                    message:
                      type: string
                    created_at:
                      type: string
                      format: date-time
          description: ""
        "401":
          content:
            application/json:
              schema:
                detail: Unauthorized
          description: ""
  /agent-interview/error-message-log/{token}/:
    post:
      operationId: agent_interview_error_message_log_create
      description: Store error details during interview session.
      summary: Log interview error
      parameters:
        - in: path
          name: token
          schema:
            type: string
          description: JWT token containing candidate_id
          required: true
      tags:
        - Interview
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                error_message:
                  type: string
                  example: Video recording failed
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                detail: Error logged successfully
          description: ""
        "400":
          content:
            application/json:
              schema:
                detail: No error message provided
          description: ""
        "401":
          content:
            application/json:
              schema:
                detail: Unauthorized
          description: ""
  /agent-interview/store-transcript/{token}/:
    get:
      operationId: agent_interview_store_transcript_retrieve
      description:
        Store transcript details and interview duration for avatar or audio
        interview. Handles credit deduction and video creation.
      summary: Store transcript details for avatar/audio interview
      parameters:
        - in: path
          name: token
          schema:
            type: string
          description: JWT token containing candidate_id
          required: true
      tags:
        - Interview
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ""
        "400":
          description: Bad request - Invalid input or insufficient credits
        "401":
          description: Unauthorized - Invalid or expired token
        "404":
          description: Interview reservation not found
        "500":
          description: Server error - Failed to process transcript
    post:
      operationId: agent_interview_store_transcript_create
      description: Store the final video URL and ID after video upload is complete.
      summary: Save video details for interview recording
      parameters:
        - in: path
          name: token
          schema:
            type: string
          description: JWT token containing candidate_id
          required: true
      tags:
        - Interview
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ""
        "400":
          description: Bad request - Invalid input
        "401":
          description: Unauthorized - Invalid or expired token
        "500":
          description: Server error - Failed to save video details
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefresh"
          description: ""
  /candidates/:
    get:
      operationId: list_candidates
      description: Lists candidates for a given job.
      parameters:
        - in: query
          name: ai_rank_max
          schema:
            type: number
            format: double
          description: Maximum AI overall rank.
        - in: query
          name: ai_rank_min
          schema:
            type: number
            format: double
          description: Minimum AI overall rank.
        - in: query
          name: job_id
          schema:
            type: string
          description: ID of the Job to filter candidates.
          required: true
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
          description: Status to filter candidates.
        - in: query
          name: workflow_stage
          schema:
            type: string
          description: Stage to filter candidates.
      tags:
        - candidates
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCandidateListResponseList"
          description: Candidate list retrieved successfully.
    post:
      operationId: create_candidate
      description:
        Create a new candidate for a job and send an invitation email for
        an interview.
      tags:
        - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CandidateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CandidateRequest"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
          description: ""
  /candidates/{id}/:
    get:
      operationId: retrieve_candidate
      description: Retrieve details of a specific candidate.
      parameters:
